<html>
  <head>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />
    <script
      src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
      integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
      crossorigin="anonymous"
    ></script>
    <style>
      .centered {
        position: relative;
        text-align: center;
        display: grid;
        place-items: center;
        color: white;
      }

      .header {
        color: black;
        font-family: Georgia, serif;
        font-size: 38px;
      }

      p {
        font-family: 'Helvetica Neue', sans-serif;
        color: #111;
        font-size: 20px;
        line-height: 24px;
        margin: 0 0 24px;
        text-justify: inter-word;
      }

      h1 {
        color: #111;
        font-family: 'Helvetica Neue', sans-serif;
        font-size: 36px;
        font-weight: bold;
        letter-spacing: -1px;
        line-height: 1;
        text-align: center;
      }

      #demo {
        color: #111;
        font-family: 'Helvetica Neue', sans-serif;
        font-size: 22px;
        line-height: 24px;
        margin: 0 0 24px;
        text-justify: inter-word;
      }

      .form-div {
        display: flex;
        justify-content: space-around;
        align-items: center;
      }
      textarea{
    		height: 250px;
    		width: 500px;
    		border-width: medium;
    		display: inline-block;
    		word-wrap: break-word;
    		font-size: 25px;
    		padding: 10px;
    		margin: 10px;
      }
      footer {
				position: fixed;
				left: 0;
				bottom: 0;
				width: 100%;
				height: 35px;
				font-family: Cursive; 
	    		font-size: 17px;
      	background-color: rgb(0, 0, 0);
        color: white;
				text-align: center;
			}
            img{
			/* align-items: left; */
			height: 300px;
			width:300px;
		} 

    </style>
  </head>
  <body>
    <div class="container mt-5">
      <div class="centered">
        <div class="text-center text-white">
          <title>CYBER SANRAKSHAN </title>
        </div>
        <h1 class="header">CYBER SANRAKSHAN</h1>

        <p class="desc">
            (Filtering the Toxic & Offensive Speech)
        </p>

				
        <form method="POST" onSubmit="return validate();" class="form">
            <div class="form-div">
                <img src = "/static/img1.png" style="float:right">
                <textarea type="text" name="text" class="form-control mr-2" rows="10" cols="70" placeholder="Enter the comment here..."></textarea>
                <img src = "/static/img2.png" style="float:left">
                
              </div>
                <div class="form-div"></div>
                    <button type="submit" class="btn btn-outline-primary" onclick="this.form.submit();">
                        Submit
                    </button>
                </div>
        </form>

        <p id="demo" style="text-align:center">{{ variable }}</p>
      </div>
    </div>
  <footer>To Stop the Hate; Made with Love..🤍🤍</p></footer>
  </body>
</html>
